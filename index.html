<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111310" />
    <meta
      name="description"
      content="Heitor Barbosa — desenvolvimento full stack, automação e pesquisa em inteligência artificial. Conheça meus projetos e minha trajetória em engenharia de software."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Heitor Barbosa — Software Engineer</title>
    <script>
      try {
        const theme = localStorage.getItem("heitor-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
